# 推送 v* 标签（如 v0.1.0）时：打出通用二进制的 MideaBar.app，压成 zip 发布到 GitHub Releases（重推标签则替换附件）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 打包
        run: make dist
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # 标签重新推送时 Release 已存在：只替换附件，不改说明
        run: |
          ZIP="build/MideaBar-${TAG#v}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "MideaBar $TAG" \
              --generate-notes \
              --notes-file .github/release-notes.md
          fi
